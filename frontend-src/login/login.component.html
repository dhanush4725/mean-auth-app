<div class="auth-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
    <h2>Login</h2>

    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="Enter email" />
      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="field-error">
        Valid email is required
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" placeholder="Enter password" />
      <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="field-error">
        Password must be at least 6 characters
      </div>
    </div>

    <button type="submit" [disabled]="loginForm.invalid || loading">
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>

    <p class="switch-link">Don't have an account? <a routerLink="/register">Register</a></p>
  </form>
</div>
