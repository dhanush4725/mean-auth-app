<div class="auth-container">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
    <h2>Welcome Back</h2>

    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="Enter email" />
      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="field-error">
        Valid email is required
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="Enter password"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          {{ showPassword ? '🙈' : '👁️' }}
        </button>
      </div>
      <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="field-error">
        Password must be at least 6 characters
      </div>
    </div>

    <div class="remember-row">
      <input type="checkbox" id="remember" formControlName="rememberMe" />
      <label for="remember">Remember me</label>
    </div>

    <button type="submit" [disabled]="loginForm.invalid || loading">
      <span *ngIf="loading" class="spinner"></span>
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>

    <p class="switch-link">Don't have an account? <a routerLink="/register">Register</a></p>
  </form>
</div>
