<div class="auth-container">
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
    <h2>Create Account</h2>

    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="success">{{ successMessage }}</div>

    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" placeholder="Choose a username" />
      <div *ngIf="registerForm.get('username')?.touched && registerForm.get('username')?.invalid" class="field-error">
        Username must be at least 3 characters
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="Enter email" />
      <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="field-error">
        Valid email is required
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="Choose a password"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          {{ showPassword ? '🙈' : '👁️' }}
        </button>
      </div>
      <div *ngIf="registerForm.get('password')?.value" class="strength-bar-track">
        <div class="strength-bar-fill"
             [style.width.%]="passwordStrength.percent"
             [style.background]="passwordStrength.color"></div>
      </div>
      <div *ngIf="registerForm.get('password')?.value" class="strength-label"
           [style.color]="passwordStrength.color">
        {{ passwordStrength.label }}
      </div>
      <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="field-error">
        Password must be at least 6 characters
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input
        id="confirmPassword"
        type="password"
        formControlName="confirmPassword"
        placeholder="Re-enter password"
      />
      <div *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.errors?.['mismatch']" class="field-error">
        Passwords do not match
      </div>
    </div>

    <button type="submit" [disabled]="registerForm.invalid || loading">
      <span *ngIf="loading" class="spinner"></span>
      {{ loading ? 'Registering...' : 'Register' }}
    </button>

    <p class="switch-link">Already have an account? <a routerLink="/login">Login</a></p>
  </form>
</div>
